{% extends "base.html" %}
{% block content %}
<a href="/">← Choose a different role</a><h1>{{ role|capitalize }} sign-in</h1>

<aside>Demo account <b>{{ role }}-a</b><br>Password <b>CareBud-demo</b></aside>
{% endblock %}
